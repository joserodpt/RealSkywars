name: 📦 Build Minecraft Plugin

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build project
        run: mvn --batch-mode --update-snapshots clean install

      - name: Sanitize branch name
        run: echo "SAFE_REF_NAME=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealSkywars-plugin-${{ env.SAFE_REF_NAME }}
          path: realskywars-plugin/target/RealSkywarsPlugin-*.jar
          if-no-files-found: error

      - name: Publish API to GitHub Packages
        if: github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # GitHub Packages release versions are immutable: re-deploying one is
          # refused with 409/422, so every master push that does not bump the
          # version would fail the job. Probing the registry beforehand is not
          # reliable (a GET here does not answer a plain 200), so deploy and
          # treat only that refusal as "nothing to do" - bumping the version in
          # realskywars-api/pom.xml is what publishes a new release.
          log=$(mktemp)
          if mvn --batch-mode deploy -pl realskywars-api -am 2>&1 | tee "$log"; then
            exit 0
          fi

          if grep -qE 'status code: (409|422)' "$log"; then
            echo "This version is already published - nothing to do."
            exit 0
          fi
          exit 1
